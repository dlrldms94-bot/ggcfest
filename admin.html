<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사전신청 내역 | 2026 관악강감찬축제</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="./img/ggc.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="admin-page">
  <main class="admin">
    <div class="wrap admin__wrap">
      <p class="eyebrow">ADMIN</p>
      <h1>사전신청 내역</h1>
      <p class="admin__lead">2026 관악강감찬축제 사전신청 목록입니다. 이 주소는 외부에 공유하지 말아 주세요.</p>

      <form class="admin-lock" id="adminLock" hidden>
        <label>관리자 비밀번호
          <input type="password" name="key" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn-reserve">확인</button>
        <p class="admin-lock__error" id="adminLockError" hidden></p>
      </form>

      <section class="admin-board" id="adminBoard" hidden>
        <div class="admin-toolbar">
          <p class="admin-count" id="adminCount">0건</p>
          <label class="admin-search">검색
            <input type="search" id="adminQuery" placeholder="이름 또는 연락처">
          </label>
          <label class="admin-filter">방문일
            <select id="adminDay">
              <option value="">전체</option>
              <option>10월 16일 (금)</option>
              <option>10월 17일 (토)</option>
              <option>10월 18일 (일)</option>
            </select>
          </label>
          <button type="button" class="btn-reserve" id="adminCsv">CSV 저장</button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>번호</th>
                <th>이름</th>
                <th>연락처</th>
                <th>방문 희망일</th>
                <th>신청 일시</th>
              </tr>
            </thead>
            <tbody id="adminRows">
              <tr><td colspan="5">불러오는 중…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="./js/admin.js"></script>
</body>
</html>
